<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="NinjaNext Technologies: Build AI-powered products your customers love.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset=".55" stop-color="#0E0B26"/>
      <stop offset="1" stop-color="#1B1145"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151132"/>
      <stop offset="1" stop-color="#0A0A1C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="560" rx="28"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      .orb3 { animation: drift3 16s ease-in-out infinite alternate; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out -2s infinite; }
      .float3 { animation: float 8s ease-in-out -4s infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1010px 252px; }
      .dot { animation: blink 1.4s ease-in-out infinite; }
      .dot2 { animation: blink 1.4s ease-in-out .2s infinite; }
      .dot3 { animation: blink 1.4s ease-in-out .4s infinite; }
      .fade { animation: fadeup 1.2s ease-out both; }
      .fade2 { animation: fadeup 1.2s ease-out .25s both; }
      .fade3 { animation: fadeup 1.2s ease-out .5s both; }
      .spark { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 3s ease-out .6s forwards; }
      @keyframes drift1 { to { transform: translate(120px, 60px); } }
      @keyframes drift2 { to { transform: translate(-140px, -40px); } }
      @keyframes drift3 { to { transform: translate(60px, -80px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <circle class="orb1" cx="180" cy="80" r="220" fill="#7C3AED" opacity=".45" filter="url(#blur)"/>
    <circle class="orb2" cx="1080" cy="420" r="240" fill="#2563EB" opacity=".40" filter="url(#blur)"/>
    <circle class="orb3" cx="760" cy="40" r="160" fill="#EC4899" opacity=".22" filter="url(#blur)"/>
    <rect width="1280" height="560" fill="url(#grid)"/>

    <!-- Brand -->
    <g class="fade" transform="translate(72 64)">
      <rect width="44" height="44" rx="12" fill="url(#btn)"/>
      <text x="22" y="30" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">N</text>
      <text x="60" y="29" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing=".3">NinjaNext <tspan fill="#A5A3C8" font-weight="500">Technologies</tspan></text>
    </g>

    <!-- Eyebrow chip -->
    <g class="fade" transform="translate(72 146)">
      <rect width="290" height="34" rx="17" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".16"/>
      <circle class="dot" cx="20" cy="17" r="5" fill="#22D3EE"/>
      <text x="36" y="22" font-size="13" font-weight="700" fill="#E9E6FF" letter-spacing="2">AI-ENABLED PRODUCT STUDIO</text>
    </g>

    <!-- Headline -->
    <g class="fade2">
      <text x="72" y="248" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">Build AI-powered products</text>
      <text x="72" y="310" font-size="54" font-weight="800" fill="url(#brand)" letter-spacing="-1.2">your customers love.</text>
    </g>

    <!-- Subline -->
    <g class="fade3">
      <text x="72" y="360" font-size="19" fill="#B9B6D9">Apps, platforms and AI automation, designed, built</text>
      <text x="72" y="388" font-size="19" fill="#B9B6D9">and launched end to end by one dedicated partner.</text>
    </g>

    <!-- Buttons -->
    <g class="fade3" transform="translate(72 424)">
      <rect width="232" height="56" rx="28" fill="url(#btn)"/>
      <rect width="232" height="56" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".25"/>
      <text x="116" y="35" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Start your project  →</text>
      <g transform="translate(252 0)">
        <rect width="208" height="56" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".22"/>
        <text x="104" y="35" text-anchor="middle" font-size="17" font-weight="600" fill="#E9E6FF">See our products</text>
      </g>
    </g>

    <!-- Visual: phone with AI assistant -->
    <g class="float" transform="translate(890 70)">
      <rect x="-6" y="-6" width="252" height="432" rx="44" fill="#7C3AED" opacity=".35" filter="url(#soft)"/>
      <rect width="240" height="420" rx="38" fill="#0B0B18" stroke="#FFFFFF" stroke-opacity=".18"/>
      <rect x="12" y="12" width="216" height="396" rx="28" fill="url(#screen)"/>
      <rect x="90" y="22" width="60" height="8" rx="4" fill="#FFFFFF" opacity=".12"/>
      <text x="32" y="66" font-size="13" font-weight="700" fill="#FFFFFF">AI Assistant</text>
      <circle cx="200" cy="61" r="5" fill="#34D399"/>
      <!-- AI orb -->
      <g class="pulse">
        <circle cx="120" cy="182" r="46" fill="url(#btn)" opacity=".25"/>
        <circle cx="120" cy="182" r="30" fill="url(#btn)"/>
        <text x="120" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">AI</text>
      </g>
      <!-- chat -->
      <rect x="28" y="248" width="150" height="34" rx="14" fill="#FFFFFF" opacity=".08"/>
      <text x="42" y="270" font-size="12" fill="#D6D3F5">How can I help today?</text>
      <rect x="70" y="292" width="142" height="34" rx="14" fill="url(#btn)"/>
      <text x="84" y="314" font-size="12" fill="#FFFFFF">Book me for Friday</text>
      <rect x="28" y="336" width="72" height="30" rx="14" fill="#FFFFFF" opacity=".08"/>
      <circle class="dot" cx="48" cy="351" r="4" fill="#A78BFA"/>
      <circle class="dot2" cx="64" cy="351" r="4" fill="#A78BFA"/>
      <circle class="dot3" cx="80" cy="351" r="4" fill="#A78BFA"/>
    </g>

    <!-- Floating card: growth -->
    <g class="float2" transform="translate(650 40)">
      <rect width="210" height="116" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".18"/>
      <text x="20" y="32" font-size="12" fill="#A5A3C8" letter-spacing="1">ACTIVE USERS</text>
      <text x="20" y="62" font-size="26" font-weight="800" fill="#FFFFFF">Growing</text>
      <polyline class="spark" points="20,96 50,88 80,92 110,78 140,80 170,62 192,52" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating card: automation -->
    <g class="float3" transform="translate(670 360)">
      <rect width="196" height="96" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".18"/>
      <circle cx="34" cy="48" r="16" fill="#34D399" opacity=".18"/>
      <path d="M26 48l6 6 12-12" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="44" font-size="14" font-weight="700" fill="#FFFFFF">Task automated</text>
      <text x="62" y="64" font-size="12" fill="#A5A3C8">Hours saved every week</text>
    </g>

    <!-- Floating chip: launch -->
    <g class="float" transform="translate(1150 40)">
      <rect width="104" height="36" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".18"/>
      <text x="52" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#E9E6FF">🚀 Launched</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="559" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
