<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Ready to build what's next? Start your project: ask@ninjanexttech.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset=".5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".10"/></pattern>
    <clipPath id="clip"><rect width="1280" height="340" rx="28"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .o1 { animation: d1 12s ease-in-out infinite alternate; }
      .o2 { animation: d2 14s ease-in-out infinite alternate; }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      @keyframes d1 { to { transform: translate(160px, 40px); } }
      @keyframes d2 { to { transform: translate(-160px, -30px); } }
      @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle class="o1" cx="220" cy="300" r="200" fill="#EC4899" opacity=".35" filter="url(#blur)"/>
    <circle class="o2" cx="1080" cy="40" r="220" fill="#22D3EE" opacity=".30" filter="url(#blur)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>

    <text x="640" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#E9E6FF" letter-spacing="3">LET'S BUILD TOGETHER</text>
    <text x="640" y="160" text-anchor="middle" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Ready to build what's next?</text>
    <text x="640" y="200" text-anchor="middle" font-size="18" fill="#D6D3F5">Share your idea and get a clear plan, timeline and quote.</text>

    <g transform="translate(500 228)">
      <rect class="glow" x="-8" y="-8" width="296" height="76" rx="38" fill="#FFFFFF" filter="url(#blur)"/>
      <rect width="280" height="60" rx="30" fill="url(#btn)"/>
      <text x="124" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#1E1B4B">Start your project</text>
      <g class="arrow"><text x="232" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7C3AED">→</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="339" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".15"/>
</svg>
